      summary: "인증 — CSRF 토큰"
      security: []
      description: "세부 상태 규칙은 C-02 화면별 API 목록과 BE docs/02를 따른다. 변경 요청은 세션 쿠키와 CSRF 헤더를 함께 보낸다."
