components:
  schemas:
    ProblemDetail:
      type: "object"
      required:
      - "type"
      - "title"
      - "status"
      - "detail"
      properties:
        type:
          type: "string"
          example: "about:blank"
        title:
          type: "string"
          description: "업무 오류 코드는 INVALID_INPUT, CONSENT_REQUIRED, AI_JOB_RUNNING 등 대문자다. HTTP 기본 오류의 title은 Spring 기본 문장일 수 있다."
        status:
          type: "integer"
        detail:
          type: "string"
        instance:
          type: "string"
        runningJobId:
          type: "integer"
          format: "int64"
        termsVersion:
          type: "string"
        fieldErrors:
          type: "array"
          items:
            type: "object"
            properties:
              field:
                type: "string"
              message:
                type: "string"
        violations:
          type: "array"
          items:
            type: "object"
            properties:
              field:
                type: "string"
              code:
                type: "string"
              message:
                type: "string"
              index:
                type:
                - "integer"
                - "null"
        usages:
          type: "array"
          items:
            type: "object"
            required:
            - "type"
            - "id"
            - "name"
            properties:
              type:
                type: "string"
                enum:
                - "career"
                - "project"
              id:
                type: "integer"
                format: "int64"
              name:
                type: "string"
      additionalProperties: true
    JobAccepted:
      type: "object"
      properties:
        jobId:
          type: "integer"
          format: "int64"
      required:
      - "jobId"
      x-java-class: "com.nerdnam.aijob.api.JobAccepted"
    AiJobView:
      type: "object"
      properties:
        failureCode:
          anyOf:
          - type: "string"
            enum:
            - "gpu_unavailable"
            - "ai_error"
            - "timeout"
            - "internal"
          - type: "null"
        finishedAt:
          anyOf:
          - type: "string"
            format: "date-time"
          - type: "null"
        id:
          type: "integer"
          format: "int64"
        jobType:
          type: "string"
          enum:
          - "restructure"
          - "fit_analysis"
          - "writing_guide"
        lockScope:
          anyOf:
          - type: "string"
          - type: "null"
        mode:
          anyOf:
          - type: "string"
          - type: "null"
        requestedAt:
          type: "string"
          format: "date-time"
        resultId:
          anyOf:
          - type: "integer"
            format: "int64"
          - type: "null"
        status:
          type: "string"
          enum:
          - "in_progress"
          - "completed"
          - "failed"
        targetId:
          type: "integer"
          format: "int64"
        targetType:
          type: "string"
          enum:
          - "project"
          - "job_posting"
          - "fit_analysis"
      required:
      - "id"
      - "jobType"
      - "mode"
      - "targetType"
      - "targetId"
      - "lockScope"
      - "status"
      - "failureCode"
      - "resultId"
      - "requestedAt"
      - "finishedAt"
      x-java-class: "com.nerdnam.aijob.application.AiJobView"
    RatingRequest:
      type: "object"
      properties:
        comment:
          anyOf:
          - type: "string"
            maxLength: 300
            minLength: 0
          - type: "null"
        score:
          type: "integer"
          format: "int32"
          maximum: 5
          minimum: 1
      required:
      - "score"
      x-java-class: "com.nerdnam.feedback.api.RatingController$RatingRequest"
    RatingView:
      type: "object"
      properties:
        comment:
          anyOf:
          - type: "string"
          - type: "null"
        score:
          type: "integer"
          format: "int32"
        targetId:
          type: "integer"
          format: "int64"
        targetType:
          type: "string"
          enum:
          - "episode_generation"
          - "guide"
        updatedAt:
          type: "string"
          format: "date-time"
      required:
      - "targetType"
      - "targetId"
      - "score"
      - "comment"
      - "updatedAt"
      x-java-class: "com.nerdnam.feedback.application.RatingService$RatingView"
    GenerateRequest:
      type: "object"
      properties:
        feedback:
          anyOf:
          - type: "string"
            maxLength: 2000
            minLength: 0
          - type: "null"
      required: []
      x-java-class: "com.nerdnam.guide.api.WritingGuideController$GenerateRequest"
    Citation:
      type: "object"
      properties:
        chunkId:
          type: "integer"
          format: "int64"
        deleted:
          type: "boolean"
          description: "삭제한 프로젝트·사례 근거면 true. 이름은 남기고 projectId는 null, 원본 보기 버튼은 숨긴다."
        label:
          type: "string"
        projectId:
          anyOf:
          - type: "integer"
            format: "int64"
          - type: "null"
        requirementCount:
          type: "integer"
          format: "int32"
        reregistering:
          type: "boolean"
        sourceId:
          anyOf:
          - type: "integer"
            format: "int64"
          - type: "null"
        sourceType:
          type: "string"
          enum:
          - "skill"
          - "career"
          - "project_summary"
          - "episode"
      required:
      - "chunkId"
      - "sourceType"
      - "sourceId"
      - "projectId"
      - "label"
      - "requirementCount"
      - "deleted"
      - "reregistering"
      x-java-class: "com.nerdnam.guide.application.GuideViews$Citation"
    Guide:
      type: "object"
      properties:
        citations:
          type: "array"
          items:
            $ref: "#/components/schemas/Citation"
        completedAt:
          anyOf:
          - type: "string"
            format: "date-time"
          - type: "null"
        content:
          anyOf:
          - type: "object"
            additionalProperties: {}
            description: "탭별 내용은 C-04 v0.2 GuideResponse.content를 보존하고 cited_chunk_ids를 추가한다. sources의 이름·원본 id는 별도 citations 목록으로 연결한다. 로컬 스텁은 형식이 다를 수 있다."
            example:
              tab: "motive"
              message: "결제 성능 문제를 풀어 본 경험을, 더 큰 결제 트래픽에서 이어 가고 싶다."
              outline:
              - title: "회사가 지금 풀고 있는 문제"
                detail: "공고의 주요 업무 “대용량 트래픽 대응을 위한 아키텍처 개선”에서 출발하세요. 회사 서비스와 최근 소식은 직접 확인해 채우세요: [회사 관련 사실]"
                sources: []
              - title: "내가 겪은 비슷한 문제"
                detail: "프로모션 피크에 결제 승인 응답이 1.2초까지 늘었던 상황"
                sources:
                - 531
              - title: "합류하면 기여할 지점"
                detail: "캐시와 비동기 분리로 병목을 줄인 방식을 결제 승인·정산 시스템 개선에 잇기"
                sources:
                - 531
              keywords:
              - "결제 승인"
              - "대용량 트래픽"
              - "아키텍처 개선"
              avoid:
              - "회사 칭찬만 나열하기"
              - "확인하지 않은 회사 정보 쓰기"
              cited_chunk_ids:
              - 531
          - type: "null"
        createdAt:
          type: "string"
          format: "date-time"
        feedback:
          anyOf:
          - type: "string"
          - type: "null"
        generationNo:
          type: "integer"
          format: "int32"
        id:
          type: "integer"
          format: "int64"
        runningJobId:
