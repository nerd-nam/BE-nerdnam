name: 테스트

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LANG: C.UTF-8
    steps:
      - name: 코드 받기
        uses: actions/checkout@v6
      - name: JDK 21 준비
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle 캐시 준비
        uses: gradle/actions/setup-gradle@v5
      - name: 전체 테스트 실행
        run: ./gradlew test
      - name: 실패한 테스트 보고서 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          retention-days: 7
