spring:
  application:
    name: nerdnam-api
  profiles:
    default: local            # 프로필을 지정하지 않으면 application-local.yml 을 함께 읽는다

  jpa:
    open-in-view: false       # 트랜잭션 밖(컨트롤러)에서 지연 로딩이 일어나지 않게 막는다
    hibernate:
      ddl-auto: validate      # 테이블은 Flyway만 만든다. JPA는 엔티티와 테이블이 맞는지 검사만 한다
    properties:
      hibernate:
        default_schema: app
        default_batch_fetch_size: 100   # 지연 로딩 컬렉션을 IN 쿼리로 묶어 N+1 을 줄인다
        jdbc:
          time_zone: UTC

  flyway:
    schemas: app,rag          # Flyway가 관리하는 스키마 (없으면 만든다)
    default-schema: app       # flyway_schema_history 테이블 위치

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
