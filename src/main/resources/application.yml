spring:
  lifecycle:
    # Kubernetes terminationGracePeriodSeconds(90초) 안에 끝나야 한다. 남은 AI 작업은 이 단계 뒤
    # @PreDestroy 에서 실패로 정리된다 (긴 AI 호출을 종료 때 끝내려 하지 않는다)
    timeout-per-shutdown-phase: 30s
  application:
    name: nerdnam-api
  profiles:
    default: local            # 프로필을 지정하지 않으면 application-local.yml 을 함께 읽는다

  jpa:
    open-in-view: false       # 트랜잭션 밖(컨트롤러)에서 지연 로딩이 일어나지 않게 막는다
    hibernate:
      ddl-auto: validate      # 테이블은 Flyway만 만든다. JPA는 엔티티와 테이블이 맞는지 검사만 한다
    properties:
      hibernate:
        default_schema: app
        default_batch_fetch_size: 100   # 지연 로딩 컬렉션을 IN 쿼리로 묶어 N+1 을 줄인다
        jdbc:
          time_zone: UTC

  jackson:                      # 응답 JSON 의 enum 값은 소문자 (D-10, 기획서 v1.25). MET → "met", IN_PROGRESS → "in_progress"
    datatype:
      enum:
        write_enums_to_lowercase: true
    mapper:
      accept-case-insensitive-enums: true   # 요청은 대·소문자 모두 받는다 (웹이 보내는 값이 바뀌는 중)

  data:
    redis:                      # 세션 저장소·결과 캐시 (기획서 5.3). 로컬은 compose.yaml 의 컨테이너
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s               # 명령 하나의 제한 시간. Redis 가 느려도 요청이 매달리지 않게 짧게
  session:                      # 세션을 서버 메모리에 두면 재시작·서버 2대에서 로그인이 풀린다.
    timeout: 7d                 # 저장소는 클래스패스로 정해진다 (spring-boot-starter-session-data-redis)
    data:                       # 쿠키는 브라우저를 닫으면 사라진다 (기본값 — 세션 쿠키)
      redis:
        namespace: nerdnam:session   # 키는 nerdnam:session:sessions:{세션 id}
        repository-type: default     # 키스페이스 알림을 구독하지 않는 방식. indexed 는 Redis 설정이 더 필요하다

  security:
    oauth2:
      client:
        registration:             # 클라이언트 id·비밀값은 환경 변수로 (없으면 로그인만 안 된다)
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope: profile,email  # openid 를 빼서 OAuth2(UserInfo) 흐름으로 받는다 → MemberOAuth2UserService
          kakao:
            client-id: ${KAKAO_CLIENT_ID:not-configured}
            client-secret: ${KAKAO_CLIENT_SECRET:not-configured}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: profile_nickname,account_email
            client-name: Kakao
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  flyway:
    schemas: app,rag          # Flyway가 관리하는 스키마 (없으면 만든다)
    default-schema: app       # flyway_schema_history 테이블 위치

server:
  port: 8080
  # SIGTERM 을 받으면 새 요청을 거절하고(readiness 도 Spring 이 내린다) 처리 중인 요청을 기다린다.
  # drain 은 readiness 를 건드리지 않으므로(BE #50) 교체 직전 트래픽 정리는 여기에 맡긴다
  shutdown: graceful

management:
  # actuator 를 **공개 포트와 분리한 관리 포트**로 옮길 수 있다 (BE #44): MANAGEMENT_PORT 를 주면
  # 그 포트에서만 열리고 공개 포트에는 actuator 가 아예 없다. 인프라는 이 포트를 Ingress 에 넣지 않고
  # Prometheus 만 NetworkPolicy 로 들여보낸다. **그때는 Kubernetes probe 도 이 포트로 와야 한다**
  # (liveness·readiness 경로가 거기 있다, BE #42).
  #
  # 기본값은 비워 둔다 — 로컬·테스트는 앱 포트(8080)에서 그대로 쓰는 게 편하고,
  # 분리는 운영에서만 필요하다. 분리하면 ManagementSecurityConfig 체인이 켜진다.
  server:
    port: ${MANAGEMENT_PORT:}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,aijob   # aijob = 배포 절차용 접수 중지·상태 (BE #45)
  endpoint:
    health:
      probes:
        enabled: true             # Kubernetes 밖에서도 health/liveness·health/readiness 가 있게 (BE #42)
      group:
        # liveness = "프로세스가 살아 있나". DB·Redis 를 넣으면 DB 가 잠깐 끊겨도 Pod 가 재시작된다
        liveness:
          include: livenessState
        # readiness = "요청을 받을 수 있나". DB 없이는 어떤 API 도 못 하고,
        # Redis 가 없으면 세션 쓰는 요청이 500 이므로 둘 다 넣는다 (BE #42 질문에 대한 답)
        readiness:
          include: readinessState,db,redis

nerdnam:
  auth:
    mode: session                     # session = 소셜 로그인 쿠키 세션 / header = X-Member-Id (local 전용)
    terms-version: "2026-10"          # 약관 버전. 바꾸면 모두에게 동의를 다시 받는다
    web-origin: http://localhost:3000 # 웹 주소 (CORS)
    login-success-url: http://localhost:3000/
    login-failure-url: http://localhost:3000/?login=failed
  ai:
    base-url: http://localhost:8000   # AI 서버(FastAPI) 주소
    stub: false                       # true 면 AI 서버 대신 고정 응답 스텁 (local 프로필은 true)
    connect-timeout: 2s               # 연결 시간 제한. GPU 서버가 꺼져 있으면 빨리 실패하도록 짧게 (ADR-0001)
    read-timeout: 30s                 # 응답 시간 제한 기본값 (아래 목록에 없는 엔드포인트)
    # 엔드포인트별 응답 시간 제한. 읽기 시간 초과는 다시 시도하지 않으므로(기획서 v1.28) 그 작업은 바로 실패한다.
    #
    # **보수적으로 잡는다.** 느린 이유는 모델이 오래 생각해서가 아니라 Bedrock 계정 호출 한도
    # (ThrottlingException)에 걸려 AI 서버가 기다렸다 다시 보내기 때문이다(ADR-0007). 그래서 데이터가 커질수록
    # 길어진다. 제한을 넘기면 그 작업은 실패하고 **이미 성공한 Bedrock 호출까지 버려진다**(과금은 됨).
    # 짧게 잡아 얻는 것은 거의 없고, 길게 잡아 잃는 것은 작업 스레드를 더 오래 잡는 것뿐이다(threads: 4).
    #
    # 2026-10-27 로컬 실측과, 실제 서비스에서 커지는 축을 함께 본 값이다:
    #
    #   엔드포인트              실측(테스트 데이터)        실제로 커지는 축                     설정
    #   /embed(문서 32건 배치)  19~34초 (한도 걸림)        청크 수백 개 → 배치가 이어져 압박↑   120초
    #   /embed(질의 20건)       0.4~4.8초                  요건 수만큼 (한 요청)                (같은 값)
    #   /requirements/extract   20줄 8.6초                 요건 30~40줄                         120초
    #   /restructure            사례 1개 2.4초             사례 5~10개 → 출력 토큰 수배         180초
    #   /match                  요건 20개 41~63초          요건마다 LLM 병렬 → 요건 수에 비례   300초
    #   /gap-guide              —                          미충족 요건만, /match 와 같은 구조   120초
    #   /guide                  —                          탭 5개 동시 (기획서 v1.59)           300초
    #
    # 측정은 청크 19개·요건 20개·청크 평균 190자인 작은 데이터다. 실제 사용자는 이보다 크다.
    # 실제로 전 설정(embed 10초·match 30초)으로 분석이 TIMEOUT·GPU_UNAVAILABLE 로 실패했다.
    # 근본 해결은 AI 쪽 동시 호출 상한과 계정 한도 상향이다 (AI-nerdnam#32) — 그게 들어오면 다시 줄인다.
    # GPU 서버 시절 성능 목표(재구성 15초·리포트 20초·방향성 60초)와 혼동하지 말 것.
    read-timeouts:
      health: 2s
      embed: 120s                     # 문서 배치(32건)가 한도에 걸리면 19~34초. 청크가 많으면 배치가 이어져 더 길어진다
      requirements-extract: 120s      # 20줄 8.6초. 요건이 30~40줄이면 길어진다
      restructure: 180s               # 사례 1개 2.4초지만 출력 토큰이 사례 수에 비례한다 (가장 과소평가하기 쉬운 값)
      match: 300s                     # 요건마다 LLM 을 병렬로 부른다. 요건 20개에서 41~63초 — 요건 수에 비례해 늘어난다
      gap-guide: 120s                 # 미충족 요건만 대상이라 match 보다 적다. 실패하면 기본 문구로 대신한다 (ADR-0003)
      guide: 300s                     # 탭 5개를 한꺼번에 만든다 (기획서 v1.59)
  ai-job:
    sync: false                       # true 면 AI 작업을 요청 스레드에서 바로 실행 (테스트용)
    # 이보다 오래 진행 중인 작업은 실패(TIMEOUT)로 정리. **읽기 시간 제한의 합보다 커야 한다** —
    # 분석 한 건의 최악은 extract 120 + embed 120 + match 300 + gap-guide 120 = 660초다.
    # 작아지면 아직 돌고 있는 작업을 실패로 지운다
    stale-after: 20m
    threads: 4                        # AI 작업 스레드 수. 늘리면 Bedrock 동시 호출이 늘어 한도에 더 걸리므로
                                      # 시간 제한을 늘린 지금은 그대로 둔다 (대기는 큐 200칸이 받는다)
