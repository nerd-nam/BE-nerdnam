# 로컬 개발 프로필 — compose.yaml 의 컨테이너에 접속
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/nerdnam
    username: nerdnam
    password: nerdnam
  flyway:
    locations: classpath:db/migration,classpath:db/local   # db/local = 개발용 시드 (운영에는 없음)

nerdnam:
  ai:
    stub: true                      # AI 서버 대신 고정 응답 스텁을 쓴다. 실제 AI 서버에 붙일 때 false
    base-url: http://localhost:8000

logging:
  level:
    org.hibernate.SQL: debug              # 실행되는 SQL 출력
    org.hibernate.orm.jdbc.bind: trace    # SQL 파라미터 값 출력
