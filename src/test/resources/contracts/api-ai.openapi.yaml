          title: Company Intro
          default: ''
        tasks:
          items:
            type: string
          type: array
          title: Tasks
          default: []
        requirements:
          items:
            $ref: '#/components/schemas/GuideRequirement'
          type: array
          minItems: 1
          title: Requirements
        feedback:
          anyOf:
          - type: string
          - type: 'null'
          title: Feedback
      type: object
      required:
      - tab
      - requirements
      title: GuideRequest
    GuideRequirement:
      properties:
        id:
          type: integer
          title: Id
        type:
          type: string
          enum:
          - required
          - preferred
          title: Type
        text:
          type: string
          title: Text
        verdict:
          type: string
          enum:
          - met
          - partial
          - unmet
          title: Verdict
        reason:
          type: string
          title: Reason
        evidence:
          items:
            $ref: '#/components/schemas/Candidate'
          type: array
          title: Evidence
          default: []
        gap_guide:
          anyOf:
          - $ref: '#/components/schemas/GapAdvice'
          - type: 'null'
      type: object
      required:
      - id
      - type
      - text
      - verdict
      - reason
      title: GuideRequirement
    GuideResponse:
      properties:
        model:
          type: string
          title: Model
        prompt_version:
          type: string
          title: Prompt Version
        content:
