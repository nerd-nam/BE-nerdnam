# SPEC-nerdnam/contracts/api-ai.openapi.yaml 에서 복사 (C-04 v0.2.0, 2026-10-23, SPEC PR #39)
# 계약이 바뀌면 다시 복사한다. 대조는 ApiAiContractTest 가 한다.
openapi: 3.1.0
info:
  title: nerdnam-ai
  description: 'API ↔ AI 계약 (C-04). 출처는 AI 레포 `app/schemas.py`, 규칙은 SPEC 기획서 5.5 "AI 서버 공통 규칙".


    - 모든 생성 응답에 `model`·`prompt_version`. `prompt_version`이 `"stub"`이면 가짜 응답(저장 안 함), `/embed`는 `embedding_model`이 `"stub"`.

    - 실패: 연결 실패·연결 시간 초과·503 → `GPU_UNAVAILABLE`(1회 재시도), 읽기 시간 초과 → `TIMEOUT`(재시도 안 함), 422 → `AI_ERROR`(재시도 안 함), 그 밖 5xx → `AI_ERROR`(1회 재시도).

    - 타임아웃: 연결 2초. 읽기 `/health` 2초 · `/embed` 10초 · `/requirements/extract` 20초 · `/restructure` 30초 · `/match` 30초 · `/gap-guide` 20초 · `/guide` 120초.

    - `/guide`는 탭마다 1회 호출, JSON 응답(SSE 아님).

    '
  version: 0.2.0
paths:
  /embed:
    post:
      summary: Embed
      operationId: embed_embed_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbedRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbedResponse'
        '503':
          description: 모델 준비 안 됨 (GPU_UNAVAILABLE)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /restructure:
    post:
      summary: Restructure
      operationId: restructure_restructure_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestructureRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestructureResponse'
        '503':
          description: 모델 준비 안 됨 (GPU_UNAVAILABLE)
        '502':
          description: LLM 출력 형식 오류 (AI_ERROR)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /requirements/extract:
    post:
      summary: Extract
      operationId: extract_requirements_extract_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractResponse'
        '503':
          description: 모델 준비 안 됨 (GPU_UNAVAILABLE)
        '502':
          description: LLM 출력 형식 오류 (AI_ERROR)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /match:
    post:
      summary: Match
      operationId: match_match_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MatchRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchResponse'
        '503':
          description: 모델 준비 안 됨 (GPU_UNAVAILABLE)
        '502':
          description: LLM 출력 형식 오류 (AI_ERROR)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /gap-guide:
    post:
      summary: Gap Guide
      operationId: gap_guide_gap_guide_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GapGuideRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GapGuideResponse'
        '503':
          description: 모델 준비 안 됨 (GPU_UNAVAILABLE)
        '502':
          description: LLM 출력 형식 오류 (AI_ERROR)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /guide:
    post:
      summary: Guide
      operationId: guide_guide_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuideRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuideResponse'
        '503':
          description: 모델 준비 안 됨 (GPU_UNAVAILABLE)
        '502':
          description: LLM 출력 형식 오류 (AI_ERROR)
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
components:
  schemas:
    Answer:
      properties:
        question:
          type: string
          title: Question
        answer:
          type: string
          title: Answer
      type: object
      required:
      - question
      - answer
      title: Answer
    Candidate:
      properties:
        chunk_id:
          type: integer
          title: Chunk Id
        chunk_type:
          type: string
          enum:
          - skill
          - career
          - project_summary
          - episode
          title: Chunk Type
        text:
          type: string
          title: Text
      type: object
      required:
      - chunk_id
      - chunk_type
      - text
      title: Candidate
      description: 청크. 사용자 정보 없이 id와 텍스트만 (기획서 5.5)
    CareerContent:
      properties:
        message:
          type: string
          title: Message
        outline:
          items:
            $ref: '#/components/schemas/Paragraph'
          type: array
          minItems: 1
          title: Outline
        keywords:
          items:
            type: string
          type: array
          title: Keywords
          default: []
        avoid:
          items:
            type: string
          type: array
          title: Avoid
          default: []
        tab:
          type: string
          const: career
          title: Tab
        rewrites:
          items:
            $ref: '#/components/schemas/Rewrite'
          type: array
          title: Rewrites
          default: []
      type: object
      required:
      - message
      - outline
      - tab
      title: CareerContent
    Clarification:
      properties:
        key:
          anyOf:
          - type: string
          - type: 'null'
          title: Key
        field:
          anyOf:
          - type: string
          - type: 'null'
          title: Field
        question:
          type: string
          title: Question
        example:
          anyOf:
          - type: string
          - type: 'null'
          title: Example
      type: object
      required:
      - question
      title: Clarification
      description: 확인 질문. key가 없거나 겹치면 API가 q1, q2…를 붙인다
    Coverage:
      properties:
        requirement_id:
          type: integer
          title: Requirement Id
        covered:
          type: boolean
          title: Covered
        where:
          type: string
          title: Where
      type: object
      required:
      - requirement_id
      - covered
      - where
      title: Coverage
    EmbedItem:
      properties:
        text:
          type: string
          minLength: 1
          title: Text
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
      type: object
      required:
      - text
      title: EmbedItem
    EmbedRequest:
      properties:
        purpose:
          type: string
          enum:
          - document
          - query
          title: Purpose
        items:
          items:
            $ref: '#/components/schemas/EmbedItem'
          type: array
          minItems: 1
          title: Items
      type: object
      required:
      - purpose
      - items
      title: EmbedRequest
    EmbedResponse:
      properties:
        embedding_model:
          type: string
          title: Embedding Model
        dim:
          type: integer
          title: Dim
        vectors:
          items:
            items:
              type: number
            type: array
          type: array
          title: Vectors
      type: object
      required:
      - embedding_model
      - dim
      - vectors
      title: EmbedResponse
    Episode:
      properties:
        title:
          type: string
          title: Title
        role:
          type: string
          title: Role
          default: ''
        problem:
          type: string
          title: Problem
        solution:
          type: string
          title: Solution
        result:
          type: string
          title: Result
        skills:
          items:
            type: string
          type: array
          title: Skills
          default: []
        metrics:
          items:
            $ref: '#/components/schemas/Metric'
          type: array
          title: Metrics
          default: []
        source_spans:
          items:
            prefixItems:
            - type: integer
            - type: integer
            type: array
            maxItems: 2
            minItems: 2
          type: array
          title: Source Spans
          default: []
        clarifications:
          items:
            $ref: '#/components/schemas/Clarification'
          type: array
          title: Clarifications
          default: []
      type: object
      required:
      - title
      - problem
      - solution
      - result
      title: Episode
      description: 사례 (기획서 4.3 에피소드 모양)
    ExtractRequest:
      properties:
        lines:
          items:
            $ref: '#/components/schemas/RequirementLine'
          type: array
          minItems: 1
          title: Lines
      type: object
      required:
      - lines
      title: ExtractRequest
    ExtractResponse:
      properties:
        model:
